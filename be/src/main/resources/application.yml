spring:
  application:
    name: sushi-oishi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sushioishi}
    username: ${DB_USERNAME:sushioishi}
    password: ${DB_PASSWORD:sushioishi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

sushioishi:
  model:
    version: v1
