spring:
  application:
    name: SushiSoon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sushisoon}
    username: ${DB_USERNAME:sushisoon}
    password: ${DB_PASSWORD:sushisoon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

sushisoon:
  model:
    version: v1
