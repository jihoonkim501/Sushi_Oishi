services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sushioishi
      POSTGRES_USER: sushioishi
      POSTGRES_PASSWORD: sushioishi
    ports:
      - "5432:5432"
    volumes:
      - sushioishi-postgres-data:/var/lib/postgresql/data

volumes:
  sushioishi-postgres-data:
